name: RepairFlow tests
on:
  push:
    branches:
      - feature/customer-portal-ipad-batch-20261107
      - fix/phixar-regression-cloud-prep-20261108
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Check JavaScript syntax
        run: find . -path './node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
