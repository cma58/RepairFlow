name: RepairFlow real Neon Auth provider E2E
# Real provider, ISOLATED Neon test branch, synthetic user only. Never mocks.
# Runs on every push to the P0 test branch (workflow_dispatch only works once this
# file exists on the default branch). Without the repository secrets the run FAILS
# as BLOCKED; it is never skipped and never green without real provider proof.
on:
  push:
    branches:
      - test/p0-webauthn-browser-e2e-recovery
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: neon-auth-e2e
    env:
      PHIXAR_E2E_ENVIRONMENT: ${{ secrets.PHIXAR_E2E_ENVIRONMENT }}
      PHIXAR_E2E_NEON_AUTH_URL: ${{ secrets.PHIXAR_E2E_NEON_AUTH_URL }}
      PHIXAR_E2E_TRUSTED_ORIGIN: ${{ secrets.PHIXAR_E2E_TRUSTED_ORIGIN }}
      PHIXAR_E2E_USER_EMAIL: ${{ secrets.PHIXAR_E2E_USER_EMAIL }}
      PHIXAR_E2E_USER_PASSWORD: ${{ secrets.PHIXAR_E2E_USER_PASSWORD }}
      PHIXAR_E2E_RUNTIME_DATABASE_URL: ${{ secrets.PHIXAR_E2E_RUNTIME_DATABASE_URL }}
      PHIXAR_E2E_ORGANIZATION_ID: ${{ secrets.PHIXAR_E2E_ORGANIZATION_ID }}
      PHIXAR_E2E_BRANCH_ID: ${{ secrets.PHIXAR_E2E_BRANCH_ID }}
      PHIXAR_E2E_EXPECTED_ROLE: ${{ secrets.PHIXAR_E2E_EXPECTED_ROLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Real provider E2E (fails as BLOCKED without secrets)
        run: npm run test:provider
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-auth-provider-evidence
          path: test-results/provider-e2e
          retention-days: 14
