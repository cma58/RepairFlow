name: RepairFlow P0 security E2E
# Real PostgreSQL (preinstalled on ubuntu-24.04) + real Chrome (preinstalled) with
# CDP virtual WebAuthn authenticators. No secrets, no Neon/Vercel access needed.
on:
  push:
    branches:
      - test/p0-webauthn-browser-e2e-recovery
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Show prerequisites
        run: |
          ls /usr/lib/postgresql/*/bin/initdb
          google-chrome --version
      - name: Unit tests
        run: npm test
      - name: Security integration + browser E2E (fails, never skips, when prerequisites are missing)
        run: npm run test:security
      - name: Upload traces, screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-e2e-evidence
          path: test-results/security-e2e
          retention-days: 14
