<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHIXAR · Beveiligde aanmelding</title>
<style>body{background:#0b1020;color:#eef4ff;font:16px system-ui;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;box-sizing:border-box}main{background:#121a2d;border:1px solid #283451;border-radius:18px;padding:28px;width:min(440px,100%)}h1{margin:0 0 8px}p{color:#b3bfd8;line-height:1.5}label{display:block;margin:20px 0 8px}input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;border:1px solid #71809d;background:#080d18;color:white;font:inherit}button{margin-top:16px;width:100%;border:0;border-radius:9px;padding:13px;background:#6ea8fe;color:#0b1020;font-weight:700;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{min-height:24px}small{color:#aebbd2}</style></head>
<body><main><h1>PHIXAR</h1><p>Beveiligde medewerkerslogin</p><form id="login" hidden><label for="email">E-mailadres</label><input id="email" type="email" autocomplete="email" required placeholder="naam@voorbeeld.be"><button id="send" type="submit">Stuur mij een inloglink</button></form><p id="status" role="status" aria-live="polite"></p><a id="workspace-link" href="/workspace" hidden>Open geïsoleerde cloudwerkruimte</a><small>Gebruik alleen je eigen mailbox. Een inloglink is persoonlijk en maximaal 10 minuten geldig. De toegang tot klantdossiers wordt pas geactiveerd nadat je account is goedgekeurd. De inlogpagina geeft op zichzelf geen toegang.</small></main>
<script>
'use strict';
// When login is enabled, Neon redirects its one-time verifier to our first-party callback.
const verifiedCallbackURL=location.origin+'/api/auth/callback';
const form=document.getElementById('login'),status=document.getElementById('status'),button=document.getElementById('send');
const workspaceLink=document.getElementById('workspace-link');
const params=new URLSearchParams(location.search);
async function checkSession(returning=false){
 status.textContent='Aanmeldsessie controleren…';
 try{
  const response=await fetch('/api/auth/session',{method:'GET',credentials:'same-origin',headers:{'Accept':'application/json'},cache:'no-store'});
  if(response.status===401&&!returning){await loadReadiness();return}
  if(!response.ok)throw new Error('session unavailable');
  const data=await response.json();
  if(data&&data.authenticated){
   const staffResponse=await fetch('/api/auth/me',{method:'GET',credentials:'same-origin',headers:{'Accept':'application/json'},cache:'no-store'});
   if(staffResponse.ok){
    const staff=await staffResponse.json();
    form.hidden=true;
    workspaceLink.hidden=false;
    status.textContent='Sessie en medewerkersrechten bevestigd ('+staff.role+'). De geïsoleerde cloudwerkruimte is beschikbaar voor tests; bestaande browsergegevens worden niet automatisch overgezet.';
   }else if(staffResponse.status===403){
    if(sessionStorage.getItem('rf_pending_invitation')){
     form.hidden=true;workspaceLink.hidden=false;workspaceLink.href='/accept-invitation.html';workspaceLink.textContent='Uitnodiging accepteren';
     status.textContent='Je account is bevestigd. Accepteer nu de uitnodiging om je toegewezen rechten te activeren.';
    }else status.textContent='Je e-maillink is bevestigd, maar dit account heeft nog geen toegang tot deze winkel.';
   }else{
    status.textContent='De medewerkersrechten kunnen tijdelijk niet worden gecontroleerd. Probeer later opnieuw.';
   }
  }else{
   status.textContent='De verificatielink is verwerkt, maar er is geen sessie beschikbaar op deze website. Het probleem zit in de sessiekoppeling; vraag geen nieuwe link aan.';
  }
 }catch(error){
  status.textContent='De verificatielink is verwerkt, maar de sessie kan niet worden gecontroleerd. Het probleem zit in de sessiekoppeling; vraag geen nieuwe link aan.';
 }
}

const emailField=document.getElementById('email');
async function loadReadiness(){
 try{
  const response=await fetch('/api/auth/status',{cache:'no-store'});
  if(!response.ok)throw new Error('readiness unavailable');
  const data=await response.json();
  if(data.authentication?.loginEnabled!==true){
   form.hidden=true;
   status.textContent='Aanmelden tijdelijk gepauzeerd. De verificatiemail werkt, maar de beveiligde sessie en toegangscontrole worden nog afgewerkt. Je hoeft geen nieuwe e-mail aan te vragen.';
  }else{form.hidden=false;status.textContent='Vul je uitgenodigde e-mailadres in om een beveiligde inloglink aan te vragen.'}
 }catch(error){
  form.hidden=true;
  status.textContent='Aanmelden tijdelijk niet beschikbaar. De beveiligingscontrole kon niet worden uitgevoerd.';
 }
}
emailField.value='';
const returningFromAuth=params.has('auth_return')||params.has('error')||params.has('neon_auth_session_verifier');
if(!returningFromAuth)checkSession();
if(params.has('neon_auth_session_verifier')){const verifier=params.get('neon_auth_session_verifier');if(/^ml-[A-Za-z0-9_.-]{10,512}$/.test(verifier)){location.replace('/api/auth/callback?neon_auth_session_verifier='+encodeURIComponent(verifier))}else{history.replaceState(null,'',location.pathname);status.textContent='Ongeldige verificatielink.'}}
else if(params.has('auth_return')){history.replaceState(null,'',location.pathname);form.hidden=true;checkSession(true)}
else if(params.has('error')){status.textContent='De aanmelding is niet gelukt of de link is verlopen. Meld dit aan de beheerder.';history.replaceState(null,'',location.pathname)}
else if(params.has('token')||params.has('code')){history.replaceState(null,'',location.pathname);checkSession(true)}
else if(params.has('callback')){history.replaceState(null,'',location.pathname);checkSession(true)}
// Server-side feature flag controls availability; no access is granted from this form.
form.addEventListener('submit',async event=>{
 event.preventDefault();
 button.disabled=true;
 status.textContent='Aanvraag verwerken…';
 try{
  const response=await fetch('/api/auth/request-link',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailField.value.trim()})});
  if(!response.ok)throw Error('request_failed');
  status.textContent='De inloglink is aangevraagd. Controleer je mailbox en ongewenste e-mail.';
 }catch(e){status.textContent='Aanmelden is nog niet beschikbaar. Vraag geen extra links aan en neem contact op met de beheerder.'}
 finally{button.disabled=false}
});
</script></body></html>
