<!doctype html><html lang="nl" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>PHIXAR · Uitnodiging</title>
<link rel="stylesheet" href="/phixar-dashboard.css"><link rel="stylesheet" href="/workspace-shell.css"><style>main{max-width:700px;margin:auto;padding:24px}button{min-height:44px}p{line-height:1.5}</style></head>
<body><main><h1>Uitnodiging accepteren</h1><p>Log in met het uitgenodigde e-mailadres. Alleen een geverifieerd Neon Auth-account met deze uitnodigingscode kan de toegewezen toegang activeren.</p><p><a href="/login.html">Aanmelden</a></p><button id="accept">Uitnodiging accepteren</button><p id="status" role="status" aria-live="polite"></p></main><script>
'use strict';const key='rf_pending_invitation';const incoming=new URLSearchParams(location.hash.slice(1)).get('token');
if(incoming){if(/^[A-Za-z0-9_-]{43}$/.test(incoming))sessionStorage.setItem(key,incoming);history.replaceState(null,'',location.pathname)}
const status=document.getElementById('status'),button=document.getElementById('accept');
if(!sessionStorage.getItem(key))status.textContent='Geen geldige uitnodigingscode gevonden. Open de oorspronkelijke uitnodigingslink.';
button.onclick=async()=>{const token=sessionStorage.getItem(key);if(!token){status.textContent='Uitnodigingscode ontbreekt.';return}
 button.disabled=true;status.textContent='Identiteit en uitnodiging verifiëren…';
 try{const r=await fetch('/api/security/invitations',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'accept',token})});
  if(!r.ok)throw Error('Uitnodiging geweigerd of verlopen ('+r.status+'). Controleer je aanmelding en de uitnodigingslink.');
  sessionStorage.removeItem(key);status.textContent='Uitnodiging geaccepteerd. Je rechten worden bij iedere aanvraag opnieuw gecontroleerd.';
 }catch(e){status.textContent=e.message}finally{button.disabled=false}
};
</script></body></html>
